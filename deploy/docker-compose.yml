# Marketplace B2B — tout le projet en une commande : ./deploy/start.sh
# (ou : docker compose -f deploy/docker-compose.yml up -d --build)
#
#   web      http://localhost:5173   application React (build Vite servi par nginx)
#   api      http://localhost:8000   API Laravel
#   mailpit  http://localhost:8025   boîte de réception des e-mails de test
#   db       MySQL 8.4 (données conservées dans le volume "db-data")
#
# Réglages : copiez deploy/.env.example en deploy/.env pour changer les ports ou les adresses.
name: marketplace-b2b

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: marketplace_b2b
      MYSQL_USER: marketplace
      MYSQL_PASSWORD: ${DB_PASSWORD:-marketplace}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  api:
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      APP_NAME: "Marketplace B2B"
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${API_URL:-http://localhost:8000}
      APP_LOCALE: fr
      # Adresse de l'application web : CORS et liens des e-mails (vérification, mot de passe oublié)
      FRONTEND_URL: ${WEB_URL:-http://localhost:5173}
      FRONTEND_URLS: ${WEB_URL:-http://localhost:5173}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: marketplace_b2b
      DB_USERNAME: marketplace
      DB_PASSWORD: ${DB_PASSWORD:-marketplace}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: no-reply@marketplace.test
      LOG_CHANNEL: stderr
      # Comptes et données de démonstration au premier démarrage (base vide uniquement)
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - api-storage:/app/storage/app
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
      args:
        VITE_API_URL: ${API_URL:-http://localhost:8000}/api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  db-data:
  api-storage:
