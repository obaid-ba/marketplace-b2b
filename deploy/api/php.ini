; Réglages PHP de production (image deploy/api/Dockerfile)
memory_limit = 256M
upload_max_filesize = 6M
post_max_size = 32M
max_file_uploads = 10
max_execution_time = 60

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
