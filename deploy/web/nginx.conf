server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers générés par Vite (noms avec empreinte) : cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application monopage : toute adresse inconnue renvoie index.html (React Router s'en charge).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
