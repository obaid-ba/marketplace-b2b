# Infrastructure Render — API et site statique (déploiement gratuit).
# Base : TiDB Cloud Starter (compatible PostgreSQL, TLS obligatoire). Renseigner les
# secrets (sync: false) dans le Dashboard : DB_HOST, DB_DATABASE, DB_USERNAME, DB_PASSWORD.
# URLs déployées : API https://marketplace-api-v2-8gr1.onrender.com — Web https://marketplace-web-v2.onrender.com

envVarGroups:
  - name: marketplace-api-env
    envVars:
      - key: APP_NAME
        value: TijaraLink
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://marketplace-api-v2-8gr1.onrender.com
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_TIMEZONE
        value: Africa/Tunis
      - key: FRONTEND_URL
        value: https://marketplace-web-v2.onrender.com
      - key: FRONTEND_URLS
        value: https://marketplace-web-v2.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_URL
        value: ""
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: SANCTUM_TOKEN_EXPIRATION
        value: "10080"
      - key: MEDIA_DRIVER
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: in-v3.mailjet.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: TijaraLink
      # Le pre-deploy command est réservé aux instances payantes : sur le plan gratuit,
      # les migrations tournent au démarrage du conteneur (entrypoint.sh, idempotentes).
      - key: RUN_MIGRATIONS
        value: "true"
      # Données de démonstration : insérées uniquement si la table `users` est vide.
      - key: SEED_DEMO_DATA
        value: "true"

services:
  - type: web
    name: marketplace-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./deploy/api/Dockerfile
    healthCheckPath: /up
    # preDeployCommand non disponible sur le plan gratuit (instances payantes uniquement) :
    # les migrations sont lancées par deploy/api/entrypoint.sh via RUN_MIGRATIONS=true.
    autoDeployTrigger: commit
    envVars:
      - fromGroup: marketplace-api-env
      - key: PORT
        value: "8000"

  - type: web
    name: marketplace-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://marketplace-api-v2-8gr1.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
