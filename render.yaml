# Infrastructure Render — API et site statique (déploiement gratuit).
# Base : Neon (PostgreSQL). Renseigner les secrets (sync: false) dans le Dashboard.
# URLs déployées : API https://marketplace-api-v2-8gr1.onrender.com — Web https://marketplace-web-v2.onrender.com

envVarGroups:
  - name: marketplace-api-env
    envVars:
      - key: APP_NAME
        value: Marketplace B2B
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://marketplace-api-v2-8gr1.onrender.com
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_TIMEZONE
        value: Africa/Tunis
      - key: FRONTEND_URL
        value: https://marketplace-web-v2.onrender.com
      - key: FRONTEND_URLS
        value: https://marketplace-web-v2.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: SANCTUM_TOKEN_EXPIRATION
        value: "10080"
      - key: MEDIA_DRIVER
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Marketplace B2B
      - key: RUN_MIGRATIONS
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"

services:
  - type: web
    name: marketplace-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./deploy/api/Dockerfile
    healthCheckPath: /up
    preDeployCommand: php artisan migrate --force
    autoDeployTrigger: commit
    envVars:
      - fromGroup: marketplace-api-env
      - key: PORT
        value: "8000"

  - type: web
    name: marketplace-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://marketplace-api-v2-8gr1.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
